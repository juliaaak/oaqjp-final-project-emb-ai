<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
        textarea { width: 100%; height: 100px; font-size: 16px; padding: 8px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 24px; font-size: 18px; cursor: pointer; }
        #system_response { margin-top: 24px; padding: 16px 24px; background: #eef5ec;
                           border-left: 4px solid #2e7d32; font-size: 17px; min-height: 1em; }
        #system_response:empty { display: none; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <label for="textToAnalyze">Enter text to analyze:</label>
    <textarea id="textToAnalyze"></textarea>
    <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
    <div id="system_response"></div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
